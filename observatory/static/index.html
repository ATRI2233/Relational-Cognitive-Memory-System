<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCMS 观测站</title>
<style>
  :root{
    --bg:#0e1014; --panel:#151922; --panel-2:#1b212c; --line:#252c3a;
    --txt:#e7ebf3; --dim:#8b94a7; --dim2:#5f6a7d;
    --blue:#4f9cf9; --amber:#f5a524; --green:#2ecc8f; --red:#f2545b; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
  }
  code,pre,.mono{font-family:"SF Mono",Consolas,"Cascadia Mono",monospace}
  button{
    font:inherit;color:var(--txt);background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#232b38;border-color:#33405a}
  button.primary{background:var(--blue);border-color:var(--blue);color:#08111f;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}

  header{
    display:flex;align-items:center;gap:14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141922,#11151d);
    flex-wrap:wrap;
  }
  .brand{font-weight:700;letter-spacing:.4px;font-size:15px}
  .brand span{color:var(--blue)}
  .dbpath{color:var(--dim);font-size:12px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}
  .tabs{display:flex;gap:6px}
  .tab{padding:6px 14px;border-radius:8px;border:1px solid transparent;color:var(--dim);cursor:pointer;font-size:13px}
  .tab.on{background:var(--panel-2);border-color:var(--line);color:var(--txt)}

  main{flex:1;min-height:0;display:none;overflow:hidden}
  main.on{display:grid}
  #view-tables{grid-template-columns:250px 1fr}
  #view-traces{grid-template-columns:330px 1fr}

  aside{border-right:1px solid var(--line);overflow-y:auto;background:#11151d}
  .aside-h{padding:10px 14px;font-size:11px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;background:#11151d;z-index:2}
  .item{padding:9px 14px;border-bottom:1px solid #1a1f29;cursor:pointer;transition:.12s}
  .item:hover{background:#161c26}
  .item.on{background:#1a2331;border-left:2px solid var(--blue);padding-left:12px}
  .item .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .item .n{font-size:13px;font-weight:600}
  .item .c{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .item .d{font-size:11px;color:var(--dim2);margin-top:2px;line-height:1.45}
  .item .q{font-size:12px;color:var(--dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  section.content{overflow:auto;padding:16px 20px 40px;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .panel h3{margin:0 0 4px;font-size:13px;letter-spacing:.3px}
  .panel .sub{color:var(--dim2);font-size:12px;margin-bottom:12px}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input[type=search]{
    background:#0c0f14;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:6px 10px;font:inherit;min-width:220px;
  }
  input[type=search]:focus{outline:none;border-color:var(--blue)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#1d2431;border:1px solid var(--line);color:var(--dim)}
  .chip.pk{color:var(--amber);border-color:#3a3222;background:#241f14}
  .badge{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600}
  .b-recent{background:#12314a;color:#6cb6ff}
  .b-resonance{background:#3a2418;color:var(--amber)}
  .b-skeleton{background:#14322a;color:var(--green)}
  .b-floor{background:#1d2431;color:var(--dim)}
  .b-fill{background:#2a2340;color:var(--violet)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #1b2129;vertical-align:top}
  th{position:sticky;top:0;background:#151a23;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;z-index:1}
  tbody tr:hover{background:#161c26}
  td{color:#cfd6e4;max-width:520px;overflow-wrap:anywhere}
  td .clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .pager{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--dim);font-size:12px}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
  @media (max-width:1200px){.grid3{grid-template-columns:1fr}}
  .chan{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:520px;overflow-y:auto}
  .chan h4{margin:0 0 2px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
  .chan .meta{color:var(--dim2);font-size:11px;margin-bottom:10px}
  .cand{border-top:1px dashed #2a3240;padding:9px 0 7px}
  .cand:first-of-type{border-top:none}
  .cand .row1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--dim);margin-bottom:4px}
  .bar{height:3px;border-radius:2px;background:#0d1116;overflow:hidden;margin-bottom:6px}
  .bar i{display:block;height:100%;border-radius:2px}
  .cand .txt{font-size:12.5px;color:#d6dceb;white-space:pre-wrap;overflow-wrap:anywhere}
  .cand .det{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
  .cand .det span{font-size:10.5px;color:var(--dim2);background:#11161e;border:1px solid #212836;border-radius:5px;padding:1px 6px}
  .empty{color:var(--dim2);font-size:12px;padding:16px 0;text-align:center}

  pre.injected{
    margin:0;padding:12px;background:#0b0e13;border:1px solid var(--line);border-radius:8px;
    font-size:12px;line-height:1.7;color:#c9d3e4;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;
  }
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
  .kv dt{color:var(--dim2)}
  .kv dd{margin:0;color:#d3daea;overflow-wrap:anywhere}
  .note{font-size:12px;color:var(--dim2);line-height:1.7}
  .err{color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="brand">RCMS <span>观测站</span></div>
  <div class="dbpath mono" id="dbpath">加载中…</div>
  <div class="spacer"></div>
  <div class="tabs">
    <div class="tab on" data-view="tables">数据表</div>
    <div class="tab" data-view="traces">三路召回</div>
  </div>
  <button id="refresh">刷新</button>
</header>

<main id="view-tables" class="on">
  <aside>
    <div class="aside-h">表 · <span id="table-count">0</span></div>
    <div id="table-list"></div>
  </aside>
  <section class="content">
    <div class="panel" id="table-head">
      <h3>选择左边的表</h3>
      <div class="note">这里展示记忆库里每张表实际存储的内容。</div>
    </div>
    <div id="table-body"></div>
  </section>
</main>

<main id="view-traces">
  <aside>
    <div class="aside-h">召回记录 · 最近 <span id="trace-count">0</span> 条</div>
    <div id="trace-list"></div>
  </aside>
  <section class="content">
    <div class="panel">
      <h3>三路召回是怎么合成的</h3>
      <div class="note">
        每条记录对应一次「构建历史提示词」：从左到右分别是时间锚点、语义共振、图谱骨架三条召回通道，
        然后把候选按配置的权重融合、去重、截断，最终拼进发给 LLM 的 system prompt。
        点左侧任意一条查看当次细节。
      </div>
    </div>
    <div id="trace-body"></div>
  </section>
</main>

<script>
const CH = {
  recent:    {name:"① 时间锚点", color:"#6cb6ff", desc:"按时间衰减 × 重要性排序"},
  resonance: {name:"② 语义共振", color:"#f5a524", desc:"向量余弦 + 关键词命中"},
  skeleton:  {name:"③ 图谱骨架", color:"#2ecc8f", desc:"实体关系边扩散"},
};
const state = {tables:[], table:null, limit:50, offset:0, q:"", traces:[], trace:null};

async function api(path){
  const r = await fetch(path, {headers:{"Accept":"application/json"}});
  const j = await r.json().catch(()=>({ok:false,error:"响应不是 JSON"}));
  if(!j.ok) throw new Error(j.error || "请求失败");
  return j.data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bytes = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : n > 1024 ? (n/1024).toFixed(1)+" KB" : n+" B";

/* ── 视图切换（用 hash 记录位置，刷新/分享都能回到原处）─────── */
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  const seg = raw.split("/").filter(Boolean);
  return {view: seg[0] === "traces" ? "traces" : "tables", arg: seg[1] || ""};
}
function setHash(view, arg){
  const h = "#/" + view + (arg ? "/" + encodeURIComponent(arg) : "");
  if(location.hash !== h) history.replaceState(null, "", h);
}

async function applyFromHash(){
  const {view, arg} = parseHash();
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.view === view));
  document.getElementById("view-tables").classList.toggle("on", view === "tables");
  document.getElementById("view-traces").classList.toggle("on", view === "traces");
  try{
    // 顶部的库路径/体积在两张视图里都要显示
    if(!state.tables.length) await loadOverview();
    if(view === "tables"){
      const target = arg || (state.tables[0] && state.tables[0].name);
      if(target) await openTable(target);
    }else{
      await loadTraces(arg ? Number(arg) : undefined);
    }
  }catch(e){
    const box = view === "tables" ? document.getElementById("table-body") : document.getElementById("trace-body");
    box.innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div></div>`;
  }
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  if(location.hash === "#/" + t.dataset.view) applyFromHash();
  else location.hash = "#/" + t.dataset.view;
});
window.addEventListener("hashchange", applyFromHash);

/* ── 概览 / 表列表 ──────────────────────────────────── */
async function loadOverview(){
  const d = await api("/api/overview");
  document.getElementById("dbpath").textContent = d.db_path + (d.available ? " · " + bytes(d.size_bytes) : " · 尚未创建");
  state.tables = d.tables || [];
  document.getElementById("table-count").textContent = state.tables.length;
  const list = document.getElementById("table-list");
  list.innerHTML = state.tables.map(t => `
    <div class="item" data-table="${esc(t.name)}">
      <div class="t"><span class="n">${esc(t.title || t.name)}</span><span class="c">${t.rows}</span></div>
      <div class="d mono">${esc(t.name)}</div>
    </div>`).join("") || `<div class="empty">还没有任何表</div>`;
  list.querySelectorAll(".item").forEach(el => el.onclick = () => openTable(el.dataset.table));
}

async function openTable(name){
  state.table = name; state.offset = 0; state.q = "";
  setHash("tables", name);
  document.querySelectorAll("#table-list .item").forEach(el =>
    el.classList.toggle("on", el.dataset.table === name));
  await renderTable();
}

async function renderTable(){
  const meta = state.tables.find(t => t.name === state.table);
  const head = document.getElementById("table-head");
  head.innerHTML = `
    <h3>${esc(meta?.title || state.table)} <span class="chip mono">${esc(state.table)}</span></h3>
    <div class="sub">${esc(meta?.desc || "")}</div>
    <div class="chips">${(meta?.columns||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`;

  const body = document.getElementById("table-body");
  body.innerHTML = `<div class="panel"><div class="empty">加载中…</div></div>`;
  try{
    const qs = new URLSearchParams({limit:state.limit, offset:state.offset, q:state.q});
    const d = await api(`/api/tables/${encodeURIComponent(state.table)}?${qs}`);
    const cols = d.columns.filter(c => c.name !== "extra");
    body.innerHTML = `
      <div class="panel">
        <div class="toolbar">
          <input type="search" id="qbox" placeholder="在文本列里搜索…" value="${esc(state.q)}">
          <button id="qbtn">搜索</button>
          <span class="note">共 ${d.total} 行 · 第 ${Math.floor(d.offset/d.limit)+1} / ${Math.max(1,Math.ceil(d.total/d.limit))} 页</span>
        </div>
        ${d.rows.length ? `<div style="overflow:auto"><table>
          <thead><tr>${cols.map(c=>`<th>${esc(c.name)}<div style="font-weight:400;color:#4d5768;text-transform:none">${esc(c.type||"")}</div></th>`).join("")}</tr></thead>
          <tbody>${d.rows.map(r=>`<tr>${cols.map(c=>{
            const v = r[c.name];
            const s = v === null || v === undefined ? `<span style="color:#4d5768">NULL</span>` : esc(v);
            return `<td><div class="clip">${s}</div></td>`;
          }).join("")}</tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty">没有数据</div>`}
        <div class="pager">
          <button id="prev" ${d.offset<=0?"disabled":""}>上一页</button>
          <button id="next" ${d.offset+d.limit>=d.total?"disabled":""}>下一页</button>
        </div>
      </div>`;
    const qbox = document.getElementById("qbox");
    const doSearch = () => { state.q = qbox.value.trim(); state.offset = 0; renderTable(); };
    document.getElementById("qbtn").onclick = doSearch;
    qbox.onkeydown = e => { if(e.key === "Enter") doSearch(); };
    document.getElementById("prev").onclick = () => { state.offset = Math.max(0, state.offset-state.limit); renderTable(); };
    document.getElementById("next").onclick = () => { state.offset += state.limit; renderTable(); };
  }catch(e){
    body.innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div></div>`;
  }
}

/* ── 三路召回 ───────────────────────────────────────── */
async function loadTraces(pick){
  const list = document.getElementById("trace-list");
  list.innerHTML = `<div class="empty">加载中…</div>`;
  try{
    const d = await api("/api/traces?limit=100");
    state.traces = d;
    document.getElementById("trace-count").textContent = d.length;
    if(!d.length){
      list.innerHTML = `<div class="empty">还没有召回记录<br><span style="color:#4d5768">先和机器人聊几句</span></div>`;
      return;
    }
    list.innerHTML = d.map(t => `
      <div class="item" data-id="${t.id}">
        <div class="t"><span class="n">${esc(t.user_input || "").slice(0,26) || "(空输入)"}</span>
          <span class="c">#${t.id}</span></div>
        <div class="q">${esc(t.display_name || t.user_id || "")} · 命中 ${t.hit_count} 条 · ${t.elapsed_ms}ms</div>
        <div class="d mono">${esc(t.created_at || "")}</div>
      </div>`).join("");
    list.querySelectorAll(".item").forEach(el => el.onclick = () => openTrace(Number(el.dataset.id)));
    if(pick) await openTrace(pick);
    else if(!state.trace) await openTrace(d[0].id);
  }catch(e){
    list.innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
  }
}

async function openTrace(id){
  setHash("traces", id);
  document.querySelectorAll("#trace-list .item").forEach(el =>
    el.classList.toggle("on", Number(el.dataset.id) === id));
  const body = document.getElementById("trace-body");
  body.innerHTML = `<div class="panel"><div class="empty">加载中…</div></div>`;
  try{
    const t = await api(`/api/traces/${id}`);
    state.trace = t;
    body.innerHTML = renderTrace(t);
  }catch(e){
    body.innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div></div>`;
  }
}

function renderTrace(t){
  const fusion = t.fusion || {};
  const chans = t.channels || {};
  const extra = t.extra || {};
  const finalById = new Map((fusion.final||[]).map(f => [f.content, f]));

  const chanCards = ["recent","resonance","skeleton"].map(tag => {
    const meta = CH[tag];
    const items = chans[tag] || [];
    const max = Math.max(...items.map(i=>i.score), 0.0001);
    const min = fusion.channel_min ? fusion.channel_min[["recent","resonance","skeleton"].indexOf(tag)] : "-";
    const w = fusion.channel_weights ? fusion.channel_weights[["recent","resonance","skeleton"].indexOf(tag)] : "-";
    return `<div class="chan">
      <h4><span class="badge b-${tag}">${meta.name}</span>
        <span style="color:#5f6a7d;font-weight:400">${items.length} 条</span></h4>
      <div class="meta">${meta.desc} · 保底 ${min} 条 · 权重 ${w}</div>
      ${items.length ? items.map(i => `
        <div class="cand">
          <div class="row1">
            <span>${i.memory_id ? "记忆 #"+i.memory_id : "关系边"}</span>
            <span class="mono">score ${i.score}</span>
          </div>
          <div class="bar"><i style="width:${Math.max(4, 100*i.score/max)}%;background:${meta.color}"></i></div>
          <div class="txt">${esc(i.text)}</div>
          ${renderDetail(i.detail)}
        </div>`).join("") : `<div class="empty">本通道无候选</div>`}
    </div>`;
  }).join("");

  const finalRows = (fusion.final||[]).map((f, idx) => `
    <tr>
      <td>${idx+1}</td>
      <td><span class="badge b-${f.tag}">${CH[f.tag]?.name || f.tag}</span></td>
      <td><span class="badge ${f.stage==="floor"?"b-floor":"b-fill"}">${f.stage==="floor"?"保底":"补位"}</span></td>
      <td class="mono">${f.weighted}</td>
      <td>${f.memory_id ? "记忆 #"+f.memory_id : (f.tag === "skeleton" ? "图谱边" : "—")}</td>
      <td><div class="clip">${esc(f.content)}</div></td>
    </tr>`).join("");

  const dropped = (fusion.dedup_dropped||[]);
  const paths = t.graph_paths || [];

  return `
    <div class="panel">
      <h3>当次请求 <span class="chip mono">#${t.id}</span></h3>
      <div class="sub">${esc(t.created_at || "")}</div>
      <dl class="kv">
        <dt>用户输入</dt><dd>${esc(t.user_input)}</dd>
        <dt>归属</dt><dd>${esc(t.display_name||"")} <span class="mono" style="color:#5f6a7d">${esc(t.user_id||"")}</span> · ${esc(t.role||"")} · 会话 ${esc(t.session_id||"")}</dd>
        <dt>提取关键词</dt><dd>${(t.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join(" ") || "<span style='color:#5f6a7d'>无</span>"}</dd>
        <dt>图扩散</dt><dd>${(extra.diffused_keywords||[]).map(k=>`<span class="chip">${esc(k.label)} · ${k.weight}</span>`).join(" ") || "<span style='color:#5f6a7d'>无</span>"}</dd>
        <dt>Embedding</dt><dd>${t.embedding_ok
          ? `<span style="color:var(--green)">正常</span> · ${t.embedding_dim} 维`
          : `<span style="color:var(--amber)">本轮未取得向量</span>（语义通道退化为关键词）`}</dd>
        <dt>查询文本</dt><dd class="mono" style="font-size:11.5px">${esc(extra.query_text || t.user_input)}</dd>
        <dt>耗时</dt><dd>${t.elapsed_ms} ms</dd>
        <dt>融合参数</dt><dd>总上限 ${fusion.total_cap ?? "-"} · 保底 ${JSON.stringify(fusion.channel_min||[])} · 权重 ${JSON.stringify(fusion.channel_weights||[])}</dd>
      </dl>
    </div>

    <div class="panel">
      <h3>三条通道各自召回了什么</h3>
      <div class="sub">分数是通道内部原始分，融合时会再乘通道权重。</div>
      <div class="grid3">${chanCards}</div>
    </div>

    <div class="panel">
      <h3>融合结果 <span class="chip">${(fusion.final||[]).length} 条进入提示词</span></h3>
      <div class="sub">先按「保底」保证每路至少 ${JSON.stringify(fusion.channel_min||[])} 条，再用剩余名额按加权分补位，最后去重截断。</div>
      ${finalRows ? `<div style="overflow:auto"><table>
        <thead><tr><th>#</th><th>来源通道</th><th>阶段</th><th>加权分</th><th>记忆ID</th><th>内容</th></tr></thead>
        <tbody>${finalRows}</tbody></table></div>` : `<div class="empty">本次没有条目进入提示词</div>`}
      ${dropped.length ? `<div class="note" style="margin-top:10px">被丢弃 ${dropped.length} 条：${dropped.slice(0,8).map(d=>`<span class="chip">${esc(CH[d.tag]?.name||d.tag)} · ${esc(d.stage)}</span>`).join(" ")}${dropped.length>8?" …":""}</div>` : ""}
    </div>

    ${paths.length ? `<div class="panel">
      <h3>图谱关系链 <span class="chip">${paths.length}</span></h3>
      <div class="sub">从命中节点出发的连通路径，会作为「骨架事实」一并注入。</div>
      ${paths.map(p=>`<div class="cand"><div class="txt mono" style="font-size:12px">${esc(p)}</div></div>`).join("")}
    </div>` : ""}

    <div class="panel">
      <h3>最终注入给 LLM 的文本</h3>
      <div class="sub">${esc(t.header || "")}</div>
      <pre class="injected">${esc(t.injected || "（本轮没有注入内容）")}</pre>
    </div>`;
}

function renderDetail(d){
  if(!d || !Object.keys(d).length) return "";
  const parts = [];
  if(d.cosine !== undefined) parts.push("余弦 "+d.cosine);
  if(d.importance !== undefined) parts.push("重要性 "+d.importance);
  if(d.time_decay !== undefined) parts.push("时间衰减 "+d.time_decay);
  if(d.importance_decay !== undefined) parts.push("重要性×衰减 "+d.importance_decay);
  if(d.session_boost) parts.push("同会话 +"+d.session_boost);
  if(d.mood_match) parts.push("情绪共振 +bonus");
  if(d.mood) parts.push("情绪 "+d.mood);
  if(d.source) parts.push(d.source);
  if(d.relation) parts.push("关系 "+d.relation);
  if(d.edge_weight !== undefined) parts.push("边权 "+d.edge_weight);
  if(d.decayed_weight !== undefined) parts.push("衰减后 "+d.decayed_weight);
  if(d.days_since_seen !== undefined && d.days_since_seen !== null) parts.push(d.days_since_seen+" 天前");
  if(d.from && d.to) parts.push(d.from+" → "+d.to);
  if(d.created_at) parts.push(d.created_at);
  return parts.length ? `<div class="det">${parts.map(p=>`<span>${esc(p)}</span>`).join("")}</div>` : "";
}

/* ── 启动 ───────────────────────────────────────────── */
document.getElementById("refresh").onclick = () => applyFromHash();
applyFromHash();
</script>
